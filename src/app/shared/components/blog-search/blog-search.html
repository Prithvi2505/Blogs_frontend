<label class="flex min-h-14 w-full items-center gap-3 rounded-full border border-cyan-200 bg-white px-5 text-slate-800 shadow-sm transition hover:border-cyan-400 focus-within:border-cyan-700 focus-within:ring-2 focus-within:ring-cyan-100">
  <svg class="size-5 shrink-0 text-cyan-800" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <circle cx="10.8" cy="10.8" r="6.3" stroke="currentColor" stroke-width="1.8" />
    <path d="m15.5 15.5 4.2 4.2" stroke="currentColor" stroke-linecap="round" stroke-width="1.8" />
  </svg>
  <input
    type="search"
    class="w-full min-w-0 bg-transparent text-base outline-none placeholder:text-slate-500"
    [placeholder]="placeholder"
    aria-label="Search blogs by title, tag, or author"
    (input)="onInput($event)">
</label>
