databases:
  - name: blogs-db
    databaseName: blogs
    user: blogs
    plan: free

services:
  - type: web
    name: blogs-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blogs-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://blogs-frontend.onrender.com

  - type: web
    name: blogs-frontend
    runtime: node
    rootDir: frontend/Blogs
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run serve:ssr:Blogs
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
